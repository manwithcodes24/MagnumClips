# MagnumClips — Production Grade Secure Subdomain Architecture
# Run all: docker compose up -d --build --force-recreate

services:
  # ──────────────────── Supabase Infrastructure ────────────────────

  supabase-db:
    image: supabase/postgres:15.1.1.78
    ports:
      - "127.0.0.1:54322:5432" # Secured to local loopback interface
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c search_path="$$user",public,extensions,auth,graphql_public -c max_connections=300 -c shared_buffers=512MB
    environment:
      POSTGRES_PASSWORD: magnumclips
      JWT_SECRET: clipyoutubevideosfast-built-by-manwithcodes
      JWT_EXP: 3600
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  supabase-auth:
    image: supabase/gotrue:v2.143.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      # UPDATED: Secure production endpoint targets
      API_EXTERNAL_URL: https://supabase.upscaledu-admin.in
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:magnumclips@supabase-db:5432/postgres?search_path=auth,public,extensions&sslmode=disable
      GOTRUE_SITE_URL: https://magnumclips.upscaledu-admin.in
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: clipyoutubevideosfast-built-by-manwithcodes
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped

  supabase-rest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://postgres:magnumclips@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public,extensions,auth
      PGRST_DB_ANON_ROLE: postgres
      PGRST_JWT_SECRET: clipyoutubevideosfast-built-by-manwithcodes
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: clipyoutubevideosfast-built-by-manwithcodes
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped

  supabase-kong:
    image: kong:2.8.1
    ports:
      - "127.0.0.1:54321:8000" # Secured behind proxy loopback interface
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./docker/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      - supabase-auth
      - supabase-rest
    restart: unless-stopped

  supabase-meta:
    image: supabase/postgres-meta:v0.84.2
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: magnumclips
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped

  supabase-studio:
    image: supabase/studio:20241202-71e5240
    ports:
      - "127.0.0.1:54323:3000" # Secured
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: magnumclips
      DEFAULT_ORGANIZATION_NAME: MagnumClips
      DEFAULT_PROJECT_NAME: MagnumClips
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: https://supabase.upscaledu-admin.in
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/profile || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - supabase-kong
      - supabase-meta
    restart: unless-stopped

  # ──────────────────── Application Services ────────────────────

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379" # Secured
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000" # Secured
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:magnumclips@supabase-db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_JWT_SECRET=clipyoutubevideosfast-built-by-manwithcodes
      - CORS_ORIGINS=https://magnumclips.upscaledu-admin.in
    volumes:
      - backend_storage:/app/storage
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-auth:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:magnumclips@supabase-db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_JWT_SECRET=clipyoutubevideosfast-built-by-manwithcodes
    volumes:
      - backend_storage:/app/storage
    depends_on:
      supabase-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # UPDATED: Next.js secure environment parameters for asset compilation
        - NEXT_PUBLIC_API_URL=https://api.magnumclips.upscaledu-admin.in
        - NEXT_PUBLIC_SUPABASE_URL=https://supabase.upscaledu-admin.in
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    ports:
      - "127.0.0.1:3000:3000" # Secured
    environment:
      - NEXT_PUBLIC_API_URL=https://api.magnumclips.upscaledu-admin.in
      - NEXT_PUBLIC_SUPABASE_URL=https://supabase.upscaledu-admin.in
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  supabase_db_data:
  redis_data:
  backend_storage:
